[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-dose-ledger"
version = "0.1.0a1"
description = "FR: Intégrer une dose thermique sans masquer les lacunes | EN: Integrate thermal dose without hiding gaps | ES: Integrar dosis térmica sin ocultar huecos"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
thermal-dose-ledger = "thermal_dose_ledger.__main__:main"

[tool.setuptools.packages.find]
include = ["thermal_dose_ledger*"]
